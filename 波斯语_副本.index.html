<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        nav {
            text-align: center;
            margin: 10px 0;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        nav a:hover {
            color: #007BFF;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>欢迎来到我的博客</h1>
    </header>

    <nav>
        <a href="#home">首页</a>
        <a href="#about">关于我</a>
        <a href="#blog">博客文章</a>
        <a href="#contact">联系方式</a>
    </nav>

    <div class="container">
        <section id="home">
            <h2>首页</h2>
            <p>欢迎来到我的个人博客！在这里，我将分享我的想法和故事。</p>
        </section>

        <section id="about">
            <h2>关于我</h2>
            <p>你好，我是一名博客作者，喜欢写作和分享。</p>
        </section>

        <section id="blog">
            <h2>博客文章</h2>
            <article>
                <h3>我的第一篇文章</h3>
                <p>这是我的第一篇文章内容。更多精彩内容敬请期待！</p>
            </article>
        </section>

        <section id="contact">
            <h2>联系方式</h2>
            <p>可以通过以下方式联系我：</p>
            <ul>
                <li>邮箱：example@example.com</li>
                <li>微信：MyWeChatID</li>
            </ul>
        </section>
    </div>

    <footer>
        <p>&copy; 2025 我的博客. 保留所有权利。</p>
    </footer>
</body>
</html>
